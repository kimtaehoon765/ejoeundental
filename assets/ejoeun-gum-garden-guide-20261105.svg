<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">붓는 잇몸, 원인을 살펴보세요</title><desc id="desc">잇몸 붓기와 치주검사, 스케일링과 추가 치주치료, 재평가의 차이를 표현 홈페이지 전용 창작 진료 안내 일러스트. 실제 치아 상태와 치료 방법은 구강검사 결과에 따라 다릅니다.</desc>
