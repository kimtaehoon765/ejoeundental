<text x="375" y="641" font-size="21" font-weight="700">안전한 진료는 현재 건강상태를 알리는 것부터.</text>
<text x="378" y="675" font-size="14">의료진 지시 없이 약을 끊거나 식사를 거르지 마세요.</text>
