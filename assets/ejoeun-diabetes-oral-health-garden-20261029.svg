<text x="600" y="704" font-family="Noto Sans KR,Apple SD Gothic Neo,Malgun Gothic,sans-serif" text-anchor="middle" font-size="12" fill="#707968">창작 그림 · 실제 혈당 기록, 검사 결과, 의학적 치료 효과를 나타낸 자료가 아닙니다.</text>
