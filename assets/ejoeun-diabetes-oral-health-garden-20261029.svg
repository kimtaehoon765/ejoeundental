<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="artTitle artDesc">
<title id="artTitle">이조은치과 - 당뇨병과 잇몸 건강, 균형의 정원</title>
<desc id="artDesc">두 개의 아치형 창을 가진 장식적인 공예 포스터. 왼쪽 푸른 아치는 식사시간, 복용약, 혈당 관리에 대한 기록을 상징하는 수첩을, 오른쪽 초록 아치는 치과 검진을 상징하는 치경과 꽃을 보여 줍니다. 가운데 연결되는 정원의 길과 아래쪽 복슬복슬한 하얀 고양이가 균형을 표현합니다. 혈당 수치, 진료 소견, 실제 치료 결과는 나타내지 않습니다.</desc>
<defs>
 <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e8e9df"/><stop offset=".45" stop-color="#fff8e9"/><stop offset="1" stop-color="#e0eadf"/></linearGradient>
 <linearGradient id="indigo" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#325e71"/><stop offset=".52" stop-color="#5c8598"/><stop offset="1" stop-color="#90b7b8"/></linearGradient>
 <linearGradient id="sage" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#294f43"/><stop offset=".46" stop-color="#568b6e"/><stop offset="1" stop-color="#a7bc8e"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9a7a4e"/><stop offset=".5" stop-color="#e0c28c"/><stop offset="1" stop-color="#ac865a"/></linearGradient>
 <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdf6"/><stop offset="1" stop-color="#ede5d2"/></linearGradient>
 <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d4e0d7"/><stop offset=".43" stop-color="#fffdf7"/><stop offset="1" stop-color="#d9e6dd"/></linearGradient>
 <filter id="shadow" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#385044" flood-opacity=".16"/></filter>
