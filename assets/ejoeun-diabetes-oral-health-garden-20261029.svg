<rect x="29" y="29" width="1142" height="682" rx="9" fill="none" stroke="#d2c2a1" stroke-width="1.6"/>
<text x="71" y="91" font-family="Noto Serif KR,Apple SD Gothic Neo,Malgun Gothic,serif" font-size="40" fill="#2d5645" font-weight="700">이조은치과</text>
<text x="1126" y="82" text-anchor="end" font-family="Georgia,serif" letter-spacing="3" font-size="14" fill="#887452">AN ORIGINAL GARDEN STUDY</text>
<text x="600" y="145" font-family="Noto Serif KR,Apple SD Gothic Neo,Malgun Gothic,serif" font-size="39" text-anchor="middle" font-weight="700" fill="#234d3c">당뇨병과 잇몸 건강</text>
<text x="600" y="185" font-family="Noto Sans KR,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="19" text-anchor="middle" fill="#526b5c">혈당 관리 정보와 구강 상태를 함께 살펴봅니다</text>
