<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" role="img" aria-labelledby="ttl desc">
<title id="ttl">이조은치과 · 임신 중 구강건강 상담을 위한 창작 아르누보풍 그림</title>
<desc id="desc">살구색과 세이지색, 샴페인 금색이 어우러진 아르누보풍 정원 회화. 아치 창가에서 임신한 여성이 의자에 편안히 앉아 책을 읽고, 벽에는 꽃무늬 테두리와 이조은치과 서명이 있으며, 복슬복슬한 하얀 고양이가 곁에 웅크려 쉬고 있습니다. 진료 현장, 임신 중 치료 효과, 실제 환자 사진을 나타내지 않습니다.</desc>
<defs>
 <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7e9da"/><stop offset=".46" stop-color="#f6ebd9"/><stop offset="1" stop-color="#d9e6d7"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d3e6e0"/><stop offset=".43" stop-color="#fce7cb"/><stop offset="1" stop-color="#a9c9ad"/></linearGradient>
 <linearGradient id="arch" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#bb9f71"/><stop offset=".35" stop-color="#f4dcaa"/><stop offset=".7" stop-color="#dbc091"/><stop offset="1" stop-color="#a28d69"/></linearGradient>
 <linearGradient id="dress" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7ca396"/><stop offset=".46" stop-color="#b9c9b7"/><stop offset="1" stop-color="#598b83"/></linearGradient>
 <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#deb19b"/><stop offset=".5" stop-color="#f1ceb1"/><stop offset="1" stop-color="#d9a189"/></linearGradient>
 <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3b3636"/><stop offset=".6" stop-color="#6c4d44"/><stop offset="1" stop-color="#342f31"/></linearGradient>
 <linearGradient id="book" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffefa"/><stop offset="1" stop-color="#e9dfcb"/></linearGradient>
