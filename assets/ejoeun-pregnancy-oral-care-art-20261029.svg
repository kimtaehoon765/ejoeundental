<text x="94" y="685" font-family="Noto Sans KR,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="13" fill="#6c6d5c">임신 중 구강건강 상담을 주제로 한 창작 그림 · 실제 환자, 진료 장면 또는 치료 효과를 나타내지 않습니다.</text>
</svg>