<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="art-title art-desc">
<title id="art-title">이조은치과 창작 그림 · 오래 함께할 자연치아</title>
<desc id="art-desc">햇살이 들어오는 조용한 화가의 서재. 오래된 책과 돋보기, 꽃병, 하얀 고양이 곁에 자연치아를 상징하는 상아색 도자기 조형물이 놓여 있습니다. 실제 치아의 해부학 구조나 환자 치료 사례를 나타내지 않습니다.</desc>
<defs>
  <linearGradient id="wall" x1="0" y1="0" x2="1" y2=".9"><stop stop-color="#f7f0df"/><stop offset=".54" stop-color="#e6e4d6"/><stop offset="1" stop-color="#c2d9c9"/></linearGradient>
  <linearGradient id="view" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#f4eac7"/><stop offset=".5" stop-color="#c7d7ca"/><stop offset="1" stop-color="#8daf9d"/></linearGradient>
  <linearGradient id="landscape" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#889f8e"/><stop offset="1" stop-color="#d3d9aa"/></linearGradient>
  <linearGradient id="desk" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b48c66"/><stop offset=".42" stop-color="#d2ab7b"/><stop offset="1" stop-color="#856547"/></linearGradient>
  <linearGradient id="tooth" x1="0" y1="0" x2="1" y2=".6"><stop stop-color="#d5c5a8"/><stop offset=".22" stop-color="#fff9e9"/><stop offset=".6" stop-color="#f1e7d2"/><stop offset="1" stop-color="#ccbaa0"/></linearGradient>
  <linearGradient id="podium" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a5b3a1"/><stop offset=".55" stop-color="#627967"/><stop offset="1" stop-color="#354f40"/></linearGradient>
  <linearGradient id="book" x1="0" y1="0" x2="1" y2=".3"><stop stop-color="#254b44"/><stop offset="1" stop-color="#426f58"/></linearGradient>
  <radialGradient id="sun"><stop stop-color="#fffce8" stop-opacity=".9"/><stop offset="1" stop-color="#f3e2b5" stop-opacity="0"/></radialGradient>
  <filter id="shade" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#34493d" flood-opacity=".18"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="16"/></filter>
  <pattern id="grain" width="41" height="37" patternUnits="userSpaceOnUse"><path d="M3 8l5 -3M29 16l3 -6M12 30l4 3M34 34l3 -1" stroke="#7c7156" stroke-width="1" opacity=".07" fill="none"/><circle cx="20" cy="8" r="1.4" fill="#637358" opacity=".1"/></pattern>
  <path id="leaf" d="M0 0Q17 -17 31 -2Q12 16 0 0Z"/>
</defs>
