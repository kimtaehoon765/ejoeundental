<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">치석 제거와 잇몸 건강</title><desc id="desc">스케일링의 치석 제거 원리와 시림 상담, 추가 잇몸치료 확인을 구분 홈페이지 전용 창작 진료 안내 일러스트. 실제 치아 상태와 치료 방법은 구강검사 결과에 따라 다릅니다.</desc>
