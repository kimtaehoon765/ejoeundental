<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="arttitle artdesc">
<title id="arttitle">이조은치과 건강보험 진료 질문을 찾는 작은 도서관</title>
<desc id="artdesc">남색과 세이지색, 따뜻한 금빛의 회화풍 창작 그림. 커다란 아치형 서가에 아홉 권의 질문 책이 놓여 있고 나무 바닥에 복슬복슬한 하얀 고양이가 앉아 있습니다. 정확한 건강보험 적용 여부는 개별 진단과 급여 기준에 따라 결정됩니다.</desc>
<defs>
<linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#193a3e"/><stop offset=".5" stop-color="#315656"/><stop offset="1" stop-color="#637d66"/></linearGradient>
<linearGradient id="arch" x1="0" y1="0" x2="1" y2=".3"><stop stop-color="#dfc89f"/><stop offset=".4" stop-color="#f5ebce"/><stop offset="1" stop-color="#b3956f"/></linearGradient>
<linearGradient id="shelf" x1="0" y1="0" x2="1" y2=".7"><stop stop-color="#795b4b"/><stop offset=".46" stop-color="#bd9068"/><stop offset="1" stop-color="#614f42"/></linearGradient>
<linearGradient id="leather" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#326751"/><stop offset=".5" stop-color="#50785b"/><stop offset="1" stop-color="#1b4738"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#bdcfc8"/><stop offset=".55" stop-color="#f3e9c7"/><stop offset="1" stop-color="#a8c3b3"/></linearGradient>
<linearGradient id="floor" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#7b6751"/><stop offset=".5" stop-color="#ab8863"/><stop offset="1" stop-color="#5c5c4d"/></linearGradient>
<linearGradient id="coat" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d9e6e0"/><stop offset=".47" stop-color="#fffef6"/><stop offset="1" stop-color="#dae5df"/></linearGradient>
<radialGradient id="warmth"><stop stop-color="#fff4cb" stop-opacity=".67"/><stop offset="1" stop-color="#fff4cb" stop-opacity="0"/></radialGradient>
<filter id="shadow" x="-40%" y="-40%" width="180%" height="200%"><feDropShadow dx="1" dy="10" stdDeviation="10" flood-color="#101f22" flood-opacity=".29"/></filter>
<filter id="soft"><feGaussianBlur stdDeviation="17"/></filter>
<pattern id="grain" width="47" height="43" patternUnits="userSpaceOnUse"><path d="M3 8l4 -3M25 30l3 5M40 14l4 -1" stroke="#fff5dc" stroke-opacity=".075" stroke-width="1.2"/></pattern>
<g id="book"><rect width="52" height="155" rx="3" fill="currentColor" stroke="#e1c491" stroke-width="2"/><path d="M11 9v135M41 9v135" fill="none" stroke="#f0d7a6" stroke-width="2" opacity=".55"/><path d="M7 27h38M7 133h38" stroke="#e6c27c" stroke-width="5"/><circle cx="26" cy="78" r="13" fill="none" stroke="#e9d6a9" stroke-width="2"/><text x="26" y="86" text-anchor="middle" font-family="Georgia,serif" font-size="25" font-weight="bold" fill="#f5e8cc">?</text></g>
</defs>
<!-- Deep library wall, calm evening gallery -->
<rect width="1200" height="760" fill="url(#night)"/>
<ellipse cx="957" cy="242" rx="270" ry="350" fill="url(#warmth)"/>
<rect width="1200" height="760" fill="url(#grain)"/>
<path d="M0 0h63v760H0ZM1133 0h67v760h-67Z" fill="#d4bd92" opacity=".3"/>
<path d="M53 0h8v760h-8ZM1140 0h8v760h-8Z" fill="#f0deac" opacity=".42"/>
<!-- tall original 9-book arched cabinet -->
<g filter="url(#shadow)">
<path d="M235 586V189Q235 78 355 77H832Q965 78 965 196V588Z" fill="#b8a17a" stroke="#efd5a1" stroke-width="9"/>
<path d="M257 579V196Q257 101 360 102H831Q939 103 939 196V579Z" fill="url(#leather)" stroke="#7f6b52" stroke-width="5"/>
<path d="M279 557V197Q279 126 363 126H826Q918 130 918 201V557Z" fill="#23463e" stroke="#ccb08a" stroke-width="3"/>
<path d="M279 286h639M279 463h639" stroke="url(#shelf)" stroke-width="22" stroke-linecap="square"/>
<path d="M277 299h642M277 475h642" stroke="#edcd90" stroke-width="4" opacity=".8"/>
<path d="M281 546h637" stroke="url(#shelf)" stroke-width="29"/>
<path d="M286 538h630" stroke="#e3bf87" stroke-width="5"/>
</g>
<!-- 3 x 3 varied individually numbered books, a unique composition -->
<g filter="url(#shadow)">
<g transform="translate(370 137)" color="#477866"><use href="#book"/><text x="26" y="18" font-family="Georgia,serif" font-size="12" fill="#fff8e6" text-anchor="middle">01</text></g>
<g transform="translate(484 137)" color="#8e6a57"><use href="#book"/><text x="26" y="18" font-family="Georgia,serif" font-size="12" fill="#fff8e6" text-anchor="middle">02</text></g>
<g transform="translate(600 137)" color="#576f8a"><use href="#book"/><text x="26" y="18" font-family="Georgia,serif" font-size="12" fill="#fff8e6" text-anchor="middle">03</text></g>
<g transform="translate(347 314)" color="#7c8381"><use href="#book"/><text x="26" y="18" font-family="Georgia,serif" font-size="12" fill="#fff8e6" text-anchor="middle">04</text></g>
<g transform="translate(472 314)" color="#aa8561"><use href="#book"/><text x="26" y="18" font-family="Georgia,serif" font-size="12" fill="#fff8e6" text-anchor="middle">05</text></g>
<g transform="translate(605 314)" color="#548174"><use href="#book"/><text x="26" y="18" font-family="Georgia,serif" font-size="12" fill="#fff8e6" text-anchor="middle">06</text></g>
<g transform="translate(328 488) scale(.75 .44)" color="#806a8c"><use href="#book"/><text x="26" y="18" font-family="Georgia,serif" font-size="12" fill="#fff8e6" text-anchor="middle">07</text></g>
<g transform="translate(425 488) scale(.75 .44)" color="#c18c68"><use href="#book"/><text x="26" y="18" font-family="Georgia,serif" font-size="12" fill="#fff8e6" text-anchor="middle">08</text></g>
<g transform="translate(524 488) scale(.75 .44)" color="#5a7993"><use href="#book"/><text x="26" y="18" font-family="Georgia,serif" font-size="12" fill="#fff8e6" text-anchor="middle">09</text></g>
</g>
<!-- Apse's golden brass star and leaves, not medical imagery -->
<path d="M766 202l9 24 26 9 -26 9 -9 25 -9 -25 -26 -9 26 -9Z" fill="#e7cd87" opacity=".9"/>
<path d="M803 365q15 -20 23 -55M816 363q18 -2 28 -20M793 363q-23 -8 -29 -26" fill="none" stroke="#b2c796" stroke-width="4" stroke-linecap="round"/>
<g fill="#9eaf82"><ellipse cx="825" cy="314" rx="11" ry="26" transform="rotate(25 825 314)"/><ellipse cx="841" cy="343" rx="10" ry="23" transform="rotate(-33 841 343)"/><ellipse cx="769" cy="339" rx="10" ry="21" transform="rotate(42 769 339)"/></g>
<!-- Wooden floor, beautiful quiet reading room -->
<path d="M0 598Q406 579 672 594Q971 579 1200 602V760H0Z" fill="url(#floor)"/>
<path d="M0 604Q374 591 713 603T1200 609" fill="none" stroke="#f1d7a6" stroke-width="8" opacity=".5"/>
<path d="M0 683Q280 678 600 696T1200 687M113 609l-35 150M404 601l-27 159M822 597l37 163M1051 611l87 149" stroke="#e4c496" stroke-width="3" opacity=".37" fill="none"/>
<!-- Floral floor pattern and low reading cushion -->
<ellipse cx="944" cy="666" rx="185" ry="55" fill="#0f3e36" opacity=".3" filter="url(#soft)"/>
<ellipse cx="918" cy="652" rx="153" ry="44" fill="#8ba38d" stroke="#d6d1ae" stroke-width="6"/>
<ellipse cx="918" cy="647" rx="128" ry="33" fill="#b8c6ad" opacity=".72"/>
<!-- White fluffy cat at bottom right looking curiously toward question books -->
<g transform="translate(851 500)" filter="url(#shadow)">
<path d="M-40 133Q-71 79 -34 36Q2 5 62 32Q105 5 145 47Q175 87 164 130Q196 128 213 95Q230 73 251 92Q264 116 230 145Q183 189 122 189L2 184Q-34 178 -40 133Z" fill="url(#coat)" stroke="#c1d3ca" stroke-width="4"/>
<path d="M-23 84L-20 5 19 40Q69 12 113 40L152 2L162 85Q175 133 132 151Q74 174 9 146Q-33 128 -23 84Z" fill="#fffefa" stroke="#cad9cf" stroke-width="4"/>
<path d="M-16 40L-17 13 9 38M137 38l14 -29 0 38" fill="#f1d5cb"/>
<ellipse cx="33" cy="98" rx="8" ry="10" fill="#688b7e"/><ellipse cx="109" cy="98" rx="8" ry="10" fill="#688b7e"/>
<path d="M61 124l9 9 10 -9" fill="none" stroke="#c49291" stroke-width="4" stroke-linecap="round"/>
<path d="M16 120l-33 -8M18 128l-36 8M127 119l35 -6M129 128l37 11" fill="none" stroke="#b9c8bc" stroke-width="3"/>
<path d="M13 174q37 20 66 3M94 175q38 19 59 -1" stroke="#f2f5ee" stroke-width="24" stroke-linecap="round"/>
</g>
<!-- Poster title at upper left on independent parchment title block -->
<g filter="url(#shadow)">
<rect x="34" y="39" width="257" height="159" rx="4" fill="url(#arch)" stroke="#e8ce9d" stroke-width="3"/>
<rect x="46" y="51" width="233" height="134" rx="2" fill="none" stroke="#917857" stroke-width="2" opacity=".5"/>
</g>
<text x="68" y="92" font-family="Noto Serif KR,Apple SD Gothic Neo,Malgun Gothic,serif" font-size="31" font-weight="700" fill="#274d3c">이조은치과</text>
<text x="68" y="132" font-family="Noto Serif KR,Apple SD Gothic Neo,Malgun Gothic,serif" font-size="22" font-weight="700" fill="#2c5841">건강보험 진료</text>
<path d="M68 143h188" stroke="#94754e" stroke-width="2"/>
<text x="68" y="171" font-family="Georgia,serif" font-size="15" letter-spacing="2" fill="#6c664e">NINE QUESTIONS</text>
<!-- Reading room sign with accurate non-absolute wording -->
<g filter="url(#shadow)">
<rect x="41" y="247" width="208" height="113" rx="6" fill="#f5efdf" stroke="#bda67b" stroke-width="3"/>
<text x="66" y="283" font-size="17" font-family="Noto Serif KR,Apple SD Gothic Neo,Malgun Gothic,serif" font-weight="700" fill="#325c45">필요한 치료부터</text>
<text x="66" y="314" font-size="17" font-family="Noto Serif KR,Apple SD Gothic Neo,Malgun Gothic,serif" font-weight="700" fill="#325c45">차근차근</text>
<path d="M66 329h151" stroke="#ccb789" stroke-width="2"/>
</g>
<text x="44" y="743" font-family="Noto Sans KR,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="12" fill="#f8f1dd">창작 그림 · 보험 적용 여부와 비용은 진단·시술 종류 및 진료 당시 급여 기준에 따라 달라집니다.</text>
</svg>