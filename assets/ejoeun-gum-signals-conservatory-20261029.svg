<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="art-title art-desc">
<title id="art-title">이조은치과 창작 그림 · 잇몸의 신호를 살피는 작은 온실</title>
<desc id="art-desc">어스름한 오후 빗방울이 맺힌 온실 안, 청록빛과 금빛 선반 위에 출혈·붓기·흔들림의 세 가지 질문을 상징하는 서로 다른 화분이 놓여 있고, 하얗고 복슬복슬한 고양이가 작은 책 옆에 앉아 있습니다. 잇몸·치아 해부학이나 특정 환자의 치료 결과를 나타내지 않는 창작 회화형 장면입니다.</desc>
<defs>
<linearGradient id="dusk" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#375568"/><stop offset=".52" stop-color="#719a95"/><stop offset="1" stop-color="#c7cfaa"/></linearGradient>
<linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6efdf"/><stop offset=".52" stop-color="#dfe9db"/><stop offset="1" stop-color="#bdccbe"/></linearGradient>
<linearGradient id="tabletop" x1="0" y1="0" x2="1" y2=".8"><stop stop-color="#8b755c"/><stop offset=".48" stop-color="#c4a481"/><stop offset="1" stop-color="#5b584c"/></linearGradient>
<linearGradient id="clay" x1="0" y1="0" x2="1" y2=".6"><stop stop-color="#ba7e70"/><stop offset=".45" stop-color="#e0b19b"/><stop offset="1" stop-color="#a56e62"/></linearGradient>
<linearGradient id="jade" x1="0" y1="0" x2="1" y2=".8"><stop stop-color="#4b766f"/><stop offset=".48" stop-color="#a4c1ad"/><stop offset="1" stop-color="#376f68"/></linearGradient>
<linearGradient id="ivory" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8efe1"/><stop offset="1" stop-color="#cdbb9a"/></linearGradient>
<linearGradient id="fur" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d8e4df"/><stop offset=".43" stop-color="#fffefa"/><stop offset="1" stop-color="#d7e4db"/></linearGradient>
<radialGradient id="light"><stop stop-color="#fff8dc" stop-opacity=".85"/><stop offset="1" stop-color="#ffe8b7" stop-opacity="0"/></radialGradient>
<filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#273f39" flood-opacity=".18"/></filter>
<pattern id="flecks" width="37" height="43" patternUnits="userSpaceOnUse"><path d="M5 8l4 -3M19 33l3 5M31 18l4 2" fill="none" stroke="#a99b7b" stroke-opacity=".12" stroke-width="1.2"/></pattern>
<g id="rose" fill="#f2ded4" stroke="#c79190" stroke-width="2"><ellipse cx="0" cy="-14" rx="9" ry="16"/><ellipse cx="14" cy="-2" rx="9" ry="16" transform="rotate(60 14 -2)"/><ellipse cx="-12" cy="-2" rx="9" ry="16" transform="rotate(-60 -12 -2)"/><circle r="9" fill="#e6b7a0"/></g>
<g id="whiteflower" fill="#fff7e5" stroke="#dacbaa" stroke-width="1.5"><ellipse cx="0" cy="-14" rx="8" ry="13"/><ellipse cx="13" cy="-2" rx="8" ry="13" transform="rotate(66 13 -2)"/><ellipse cx="-13" cy="-2" rx="8" ry="13" transform="rotate(-66 -13 -2)"/><circle r="7" fill="#d5b275"/></g>
<path id="leaf" d="M0 0Q21 -20 38 -3Q19 20 0 0Z"/>
</defs>
<rect width="1200" height="760" fill="url(#wall)"/>
<rect width="1200" height="760" fill="url(#flecks)"/>
<ellipse cx="922" cy="140" rx="370" ry="280" fill="url(#light)"/>
<!-- Arched rainy greenhouse window -->
