<g fill="none" stroke="#527d65" stroke-width="7" stroke-linecap="round">
<path d="M531 462Q520 395 541 311M529 450Q570 390 595 345M528 436Q480 391 461 346"/>
</g>
<g fill="#7d9e80"><use href="#leaf" transform="translate(505 403) rotate(46)"/><use href="#leaf" transform="translate(574 378) rotate(154)"/><use href="#leaf" transform="translate(471 363) rotate(-25)"/></g>
<g fill="#e6dce9" stroke="#bb9cb4" stroke-width="2">
<circle cx="538" cy="312" r="19"/><circle cx="516" cy="320" r="13"/><circle cx="554" cy="331" r="14"/><circle cx="596" cy="344" r="18"/><circle cx="460" cy="347" r="18"/>
</g>
<g fill="#d6bd79"><circle cx="537" cy="313" r="6"/><circle cx="595" cy="346" r="5"/><circle cx="460" cy="347" r="5"/></g>
<!-- Pot 3 flexible sapling, a question of stability -->
<g fill="none" stroke="#547a60" stroke-width="6" stroke-linecap="round">
<path d="M813 463Q812 413 831 363Q849 324 828 288"/>
<path d="M824 387q-42 -38 -44 -79M830 367q43 -32 55 -72"/>
</g>
<g fill="#a1b68e">
<use href="#leaf" transform="translate(829 285) rotate(-145)"/><use href="#leaf" transform="translate(779 306) rotate(36)"/><use href="#leaf" transform="translate(886 294) rotate(160)"/><use href="#leaf" transform="translate(838 354) rotate(25)"/><use href="#leaf" transform="translate(801 383) rotate(-165)"/>
</g>
<!-- independent small title plaques under each pot -->
<g font-family="Noto Serif KR,Apple SD Gothic Neo,Malgun Gothic,serif" text-anchor="middle" font-weight="700" font-size="23" fill="#fff9e5">
<text x="245" y="555">잇몸 출혈</text><text x="530" y="555">잇몸 붓기</text>
</g>
<text x="813" y="555" font-family="Noto Serif KR,Apple SD Gothic Neo,Malgun Gothic,serif" text-anchor="middle" font-size="23" font-weight="700" fill="#486451">치아 흔들림</text>
<!-- calm white cat in right foreground with no dental tools -->
<g filter="url(#sh)" transform="translate(1005 515)">
<ellipse cx="75" cy="149" rx="113" ry="29" fill="#415849" opacity=".22"/>
<path d="M-22 106Q-49 52 -13 26Q23 -8 79 27Q118 9 144 40Q170 71 157 106Q183 108 200 77Q217 55 234 74Q241 94 219 114Q166 156 106 156L12 154Q-27 144 -22 106Z" fill="url(#fur)" stroke="#ccd9d0" stroke-width="3"/>
