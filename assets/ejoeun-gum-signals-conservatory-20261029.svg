<path d="M-2 33l2 -15 19 19M132 30l13 -16 2 21" fill="#efdad2"/>
<ellipse cx="38" cy="92" rx="6" ry="8" fill="#71968b"/><ellipse cx="111" cy="91" rx="6" ry="8" fill="#71968b"/>
<path d="M64 113l9 7 8 -7" fill="none" stroke="#c29390" stroke-width="3"/>
<path d="M16 111l-27 -5M17 119l-30 8M132 110l29 -5M132 119l29 9" stroke="#bdcbbf" stroke-width="2"/>
<path d="M15 144q25 16 51 0M92 145q25 15 53 0" stroke="#f0f5ef" stroke-width="19" fill="none" stroke-linecap="round"/>
</g>
<!-- Editorial corner plaque -->
<g filter="url(#sh)">
<rect x="51" y="43" width="471" height="150" rx="6" fill="#fff9eb" stroke="#b6a07d" stroke-width="3" opacity=".97"/>
<rect x="62" y="55" width="449" height="126" rx="3" fill="none" stroke="#ddc7a5" stroke-width="1.5"/>
</g>
<text x="83" y="95" font-family="Noto Serif KR,Apple SD Gothic Neo,Malgun Gothic,serif" font-weight="700" font-size="36" fill="#315742">이조은치과</text>
<text x="83" y="132" font-family="Noto Serif KR,Apple SD Gothic Neo,Malgun Gothic,serif" font-weight="700" font-size="21" fill="#345a47">잇몸의 신호를 살피는 작은 온실</text>
<path d="M84 142h391" stroke="#b79a71" stroke-width="2"/>
<text x="85" y="169" font-family="Georgia,serif" font-size="13" fill="#867450" letter-spacing="2.5">PERIODONTAL HEALTH · ORIGINAL ART</text>
<text x="72" y="700" font-family="Noto Sans KR,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="16" fill="#f4eedc">출혈·붓기·흔들림은 원인이 다를 수 있습니다. 증상만으로 치료를 결정하지 않습니다.</text>
<text x="72" y="728" font-family="Noto Sans KR,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="12" fill="#eee6d4">창작 온실 풍경화 · 실제 잇몸·치아 구조, 치료 과정 또는 진료 결과를 표현한 의료 도해가 아닙니다.</text>
</svg>