<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">충치치료, 깊이에 따라 다르게</title><desc id="desc">초기 충치 관찰과 필요한 우식 수복 및 레진 마무리를 구분 홈페이지 전용 창작 진료 안내 일러스트. 실제 치아 상태와 치료 방법은 구강검사 결과에 따라 다릅니다.</desc>
