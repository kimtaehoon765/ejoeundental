<text x="1378" y="817" text-anchor="end" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-size="15" fill="#586d65">이 그림은 환자 안내를 위한 개념도입니다 · 실제 치료는 검사에 따라 다릅니다</text>
