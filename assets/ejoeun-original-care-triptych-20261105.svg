<text x="524" y="238" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-size="27" font-weight="650" fill="#4c655d">치과의사가 직접 잇몸치료 · 필요한 치료부터 충분한 설명</text>
