<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="840" viewBox="0 0 1440 840" role="img" aria-labelledby="ttl dsc">
<title id="ttl">이조은치과 자연치아를 소중히, 잇몸치료·스케일링·충치치료 안내</title>
<desc id="dsc">햇살이 비치는 수채화풍 정원 속 하얀 고양이와 안경 쓴 치과의사, 아래에 잇몸 검사와 치료, 스케일링, 충치치료 개념을 나누어 표현한 이조은치과 전용 창작 일러스트레이션. 치료는 진찰 결과에 따라 달라집니다.</desc>
<defs>
