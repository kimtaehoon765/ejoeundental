<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img" aria-labelledby="t d">
<title id="t">이조은치과 치과 방문 전 준비 안내 창작 정물화</title>
<desc id="d">따뜻한 종이 위 체크리스트, 복용약 목록 봉투, 연필, 아날로그 시계, 유칼립투스 식물과 하얀 복슬복슬한 고양이를 배치한 수채화풍 안내 그림. 환자의 실제 정보나 처방전이 아닙니다.</desc>
<defs>
<linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8f0df"/><stop offset=".55" stop-color="#fff9e9"/><stop offset="1" stop-color="#dce9df"/></linearGradient>
<linearGradient id="desk" x1="0" y1="0" x2="1" y2=".7"><stop stop-color="#c39c71"/><stop offset=".54" stop-color="#f0d8b4"/><stop offset="1" stop-color="#aa825d"/></linearGradient>
<linearGradient id="sheet" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#f0eddf"/></linearGradient>
<linearGradient id="sage" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#29513e"/><stop offset="1" stop-color="#5c806a"/></linearGradient>
<linearGradient id="coat" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dce7de"/><stop offset=".52" stop-color="#fffefa"/><stop offset="1" stop-color="#e4e9e1"/></linearGradient>
<filter id="drop" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="1" dy="9" stdDeviation="11" flood-color="#4b573d" flood-opacity=".18"/></filter>
