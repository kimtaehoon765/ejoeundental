<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="paintingTitle paintingDesc">
<title id="paintingTitle">한자리의 시간 - 2003년부터 이조은치과</title>
<desc id="paintingDesc">따뜻한 햇살과 연둣빛, 황금빛 색채가 어우러진 독창적인 풍경화. 세월을 품은 커다란 나무와 정원 벤치, 먼 길을 따라 이어지는 산책로, 복슬복슬한 하얀 고양이가 보입니다. 원장 초상화나 실제 치과 건물 사진이 아닌, 한자리에서 진료해 온 시간을 상징하는 창작 회화입니다.</desc>
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2=".6" y2="1"><stop stop-color="#bcd9de"/><stop offset=".42" stop-color="#eaf2df"/><stop offset=".74" stop-color="#f7e6bd"/><stop offset="1" stop-color="#e2d2a5"/></linearGradient>
 <radialGradient id="sun" cx=".72" cy=".22" r=".66"><stop stop-color="#fffbe6" stop-opacity=".86"/><stop offset=".46" stop-color="#f7e8bf" stop-opacity=".34"/><stop offset="1" stop-color="#ffe5b7" stop-opacity="0"/></radialGradient>
 <linearGradient id="hill" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c0d5bc"/><stop offset=".66" stop-color="#84ab93"/><stop offset="1" stop-color="#62917e"/></linearGradient>
 <linearGradient id="garden" x1=".1" y1="0" x2=".9" y2="1"><stop stop-color="#b0c8a0"/><stop offset=".55" stop-color="#729b76"/><stop offset="1" stop-color="#4e7e67"/></linearGradient>
 <linearGradient id="path" x1="0" y1="0" x2=".5" y2="1"><stop stop-color="#e2c9a1"/><stop offset=".45" stop-color="#f2debb"/><stop offset="1" stop-color="#d6b185"/></linearGradient>
 <linearGradient id="bark" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#644c3c"/><stop offset=".38" stop-color="#95745d"/><stop offset=".73" stop-color="#574736"/><stop offset="1" stop-color="#9e7b61"/></linearGradient>
 <linearGradient id="catcoat" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dce8df"/><stop offset=".47" stop-color="#fffef7"/><stop offset="1" stop-color="#d6e3d8"/></linearGradient>
 <linearGradient id="leafA" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#b7c9a2"/><stop offset=".47" stop-color="#81a77f"/><stop offset="1" stop-color="#517a65"/></linearGradient>
 <linearGradient id="leafB" x1="0" y1="0" x2="1" y2=".8"><stop stop-color="#e4d49e"/><stop offset=".45" stop-color="#d3b776"/><stop offset="1" stop-color="#8ca172"/></linearGradient>
 <linearGradient id="poster" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fcf7e9"/><stop offset="1" stop-color="#eae0c9"/></linearGradient>
 <filter id="paint"><feTurbulence type="fractalNoise" baseFrequency=".017" numOctaves="2" seed="17" result="noise"/><feColorMatrix in="noise" type="saturate" values="0" result="grey"/><feComponentTransfer in="grey" result="softgrain"><feFuncA type="linear" slope=".09"/></feComponentTransfer><feBlend in="SourceGraphic" in2="softgrain" mode="multiply"/></filter>
 <filter id="shadow" x="-35%" y="-35%" width="170%" height="170%"><feDropShadow dx="1" dy="9" stdDeviation="9" flood-color="#273f34" flood-opacity=".19"/></filter>
 <filter id="blur"><feGaussianBlur stdDeviation="15"/></filter>
 <pattern id="paper" width="45" height="48" patternUnits="userSpaceOnUse"><path d="M7 10l4 -3M28 19l5 2M15 35l2 -5" stroke="#73684b" stroke-opacity=".065" stroke-width="1.4"/></pattern>
 <path id="leaves" d="M0 0Q-29 -22 -42 4Q-13 32 0 0Z"/>
 <g id="flower"><circle r="6" fill="#e8b67f"/><g fill="#fff5e0" stroke="#eee1c6" stroke-width="1"><ellipse cx="0" cy="-18" rx="7" ry="13"/><ellipse cx="17" cy="-8" rx="7" ry="13" transform="rotate(70 17 -8)"/><ellipse cx="11" cy="14" rx="7" ry="13" transform="rotate(150 11 14)"/><ellipse cx="-11" cy="14" rx="7" ry="13" transform="rotate(-150 -11 14)"/><ellipse cx="-17" cy="-8" rx="7" ry="13" transform="rotate(-70 -17 -8)"/></g></g>
</defs>
<!-- soft countryside dawn, unconnected to a specific clinic exterior -->
