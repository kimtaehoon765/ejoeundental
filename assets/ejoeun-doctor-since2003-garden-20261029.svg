<path d="M794 431Q815 523 770 684M842 439Q877 526 943 684" stroke="#fff2cd" stroke-width="6" fill="none" opacity=".5"/>
<path d="M0 597Q240 564 413 600Q500 576 629 596V700H0Z" fill="#54816d" opacity=".54"/>
<path d="M1034 589Q1120 561 1200 582V700H1050Z" fill="#608a72" opacity=".59"/>
<!-- tree roots & trunk are the central image of continuity -->
<g filter="url(#shadow)">
 <path d="M322 590Q299 524 311 430Q303 349 319 272Q341 180 363 113Q370 93 382 87Q390 83 388 110Q386 180 364 266Q375 308 367 375Q374 448 360 544Q396 568 459 581Q483 589 487 610Q460 618 420 605Q365 595 342 583Q304 603 236 607Q210 602 223 591Q264 584 289 563Q288 531 291 490L275 408Q254 334 257 259Q262 242 273 252Q283 281 299 344Q297 268 311 195Q320 137 317 111Q311 72 321 70Q348 88 348 139Q352 174 339 243L336 339Q353 277 384 236Q414 184 430 157Q439 143 446 150Q448 175 429 207Q404 247 378 309L365 405Q381 355 405 325Q440 280 464 264Q485 252 492 266Q484 289 451 324Q397 385 374 471Q372 513 381 558Z" fill="url(#bark)" stroke="#65513b" stroke-width="5"/>
 <path d="M330 522Q327 422 330 340Q337 252 347 193M345 558Q357 469 350 387M327 600Q294 604 266 606" fill="none" stroke="#b89a77" stroke-width="8" opacity=".51" stroke-linecap="round"/>
 <path d="M312 410Q304 354 303 316M379 358Q409 309 437 295" stroke="#453b32" stroke-width="6" fill="none" opacity=".43"/>
</g>
<!-- rich impressionistic layered canopy -->
<g opacity=".97" filter="url(#paint)">
 <path d="M106 276Q60 217 104 165Q122 119 185 114Q208 68 264 74Q309 43 355 65Q408 24 462 70Q530 51 562 115Q620 117 635 174Q673 215 630 255Q608 310 541 304Q496 346 445 311Q383 348 336 304Q274 340 219 307Q145 331 106 276Z" fill="url(#leafA)"/>
 <path d="M75 240Q47 178 108 156Q136 106 197 127Q225 79 282 101Q334 59 382 105Q421 77 468 104Q530 83 546 145Q604 151 589 200Q614 257 561 268Q520 307 477 273Q431 316 395 282Q326 315 295 282Q233 298 196 275Q116 300 75 240Z" fill="#6c9c75" opacity=".65"/>
 <path d="M160 174Q190 107 241 113Q286 80 328 128Q378 94 411 133Q480 105 509 156Q555 146 566 191Q534 227 487 214Q451 253 406 225Q360 261 319 231Q264 256 235 222Q192 238 160 174Z" fill="#b1c594" opacity=".8"/>
 <path d="M139 230Q183 173 237 196Q270 155 325 188Q350 154 400 173Q471 160 496 198Q543 193 563 231Q526 285 475 258Q434 288 396 266Q342 291 308 251Q256 279 224 249Q166 265 139 230Z" fill="url(#leafB)" opacity=".54"/>
</g>
<!-- painterly individual leaf marks -->
<g fill="#d5c986" opacity=".77">
 <ellipse cx="128" cy="190" rx="19" ry="10" transform="rotate(-22 128 190)"/><ellipse cx="211" cy="129" rx="16" ry="9" transform="rotate(37 211 129)"/><ellipse cx="298" cy="105" rx="22" ry="11" transform="rotate(-21 298 105)"/><ellipse cx="428" cy="113" rx="20" ry="11" transform="rotate(21 428 113)"/><ellipse cx="503" cy="173" rx="15" ry="9"/><ellipse cx="548" cy="234" rx="22" ry="10" transform="rotate(-35 548 234)"/><ellipse cx="341" cy="235" rx="20" ry="10" transform="rotate(34 341 235)"/><ellipse cx="182" cy="251" rx="18" ry="8" transform="rotate(26 182 251)"/>
</g>
<g fill="#c2d1a4" opacity=".92">
 <ellipse cx="148" cy="155" rx="17" ry="9" transform="rotate(42 148 155)"/><ellipse cx="253" cy="169" rx="19" ry="11" transform="rotate(-21 253 169)"/><ellipse cx="389" cy="94" rx="18" ry="10" transform="rotate(-13 389 94)"/><ellipse cx="466" cy="189" rx="15" ry="10" transform="rotate(-32 466 189)"/><ellipse cx="561" cy="214" rx="14" ry="8" transform="rotate(-19 561 214)"/><ellipse cx="434" cy="260" rx="17" ry="9" transform="rotate(23 434 260)"/>
</g>
<!-- a simple, original decorative garden bench: no person portrayed -->
<g filter="url(#shadow)" stroke-linecap="round">
 <path d="M842 476L1020 481L1014 545L832 537Z" fill="#ac8262" stroke="#745743" stroke-width="5"/>
 <path d="M844 498l171 7M839 521l173 7" stroke="#dec3a1" stroke-width="5"/>
 <path d="M820 540Q905 551 1034 548L1033 570Q921 576 814 561Z" fill="#795e47" stroke="#5c4b3b" stroke-width="4"/>
 <path d="M844 561l-16 74M1000 565l14 72" stroke="#5c6453" stroke-width="9"/>
 <path d="M841 478l-14 -40M1022 482l16 -44" stroke="#586452" stroke-width="8"/>
</g>
<!-- white fluffy cat resting on bench, far smaller than in portrait paintings -->
<g transform="translate(895 458) scale(.58)" filter="url(#shadow)">
 <path d="M-40 107Q-61 40 -14 15Q19 -6 60 10Q103 -13 138 15Q161 40 164 97Q184 92 204 61Q222 46 235 62Q250 78 219 104Q175 150 100 144L22 150Q-28 139 -40 107Z" fill="url(#catcoat)" stroke="#c5d7cc" stroke-width="5"/>
 <path d="M-18 62L-9 -1L31 17Q69 -6 104 19L149 -6L152 60Q165 103 126 124Q69 145 10 119Q-24 103 -18 62Z" fill="#fffefa" stroke="#ccd9cf" stroke-width="4"/>
 <path d="M-7 19l1 -16 22 15M130 17l16 -21 0 26" fill="#f0d5cf"/>
 <path d="M23 70q10 -13 21 0M91 71q12 -13 24 0" fill="none" stroke="#75907b" stroke-width="4" stroke-linecap="round"/>
 <path d="M61 88l10 8 9 -8" fill="none" stroke="#b78a87" stroke-width="4" stroke-linecap="round"/>
 <path d="M14 87l-28 -5M16 95l-31 7M120 88l32 -5M120 94l35 9" fill="none" stroke="#bac8bc" stroke-width="3"/>
</g>
<!-- wildflowers bring gallery colour without being a repeated indoor painting -->
<g opacity=".95">
 <path d="M80 658Q65 609 61 573M128 672Q145 615 145 579M190 666Q174 602 162 566M1106 661Q1118 618 1116 584M1156 663Q1147 625 1166 590" fill="none" stroke="#426f59" stroke-width="5"/>
 <use href="#flower" transform="translate(60 568) scale(1.3)"/><use href="#flower" transform="translate(145 581) scale(.95)"/><use href="#flower" transform="translate(160 563) scale(1.2)"/>
 <use href="#flower" transform="translate(1117 580) scale(1.15)"/><use href="#flower" transform="translate(1166 585) scale(1.05)"/>
 <g fill="#a5bd8b"><ellipse cx="77" cy="620" rx="13" ry="24" transform="rotate(-40 77 620)"/><ellipse cx="125" cy="638" rx="12" ry="22" transform="rotate(49 125 638)"/><ellipse cx="1106" cy="616" rx="12" ry="24" transform="rotate(45 1106 616)"/></g>
</g>
<!-- editorial museum label: depicts continuity, not real clinic frontage -->
<g filter="url(#shadow)">
<rect x="655" y="63" width="463" height="188" rx="9" fill="url(#poster)" stroke="#bba782" stroke-width="3" opacity=".98"/>
<rect x="668" y="76" width="438" height="162" rx="4" fill="none" stroke="#d6c6a4" stroke-width="1.5"/>
</g>
<text x="683" y="116" font-family="Noto Serif KR,Apple SD Gothic Neo,Malgun Gothic,serif" font-size="32" font-weight="700" fill="#2d5642">이조은치과</text>
<text x="684" y="156" font-family="Noto Serif KR,Apple SD Gothic Neo,Malgun Gothic,serif" font-size="23" font-weight="700" fill="#3b5c47">한자리에서 이어온 진료</text>
<path d="M683 170h402" stroke="#c3ad85" stroke-width="2"/>
<text x="684" y="211" font-family="Georgia,serif" font-size="23" letter-spacing="2" fill="#8b7252">SINCE 2003</text>
<!-- subtle artist plate in lower border -->
<rect width="1200" height="700" fill="url(#paper)" pointer-events="none"/>
<text x="715" y="682" font-family="Noto Sans KR,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="12" fill="#f5e7c6">‘한자리의 시간’ · 오래 이어진 진료 철학을 표현한 창작 풍경화. 실제 치과 외관은 아닙니다.</text>
</svg>