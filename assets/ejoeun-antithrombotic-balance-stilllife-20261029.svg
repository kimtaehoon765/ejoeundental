<rect x="69" y="56" width="320" height="154" fill="none" stroke="#cfb98d" stroke-width="2"/>
</g>
<text x="87" y="106" font-family="Noto Serif KR,Apple SD Gothic Neo,Malgun Gothic,serif" font-size="39" font-weight="700" fill="#355247">이조은치과</text>
