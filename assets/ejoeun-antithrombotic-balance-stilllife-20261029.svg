<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
<title id="title">이조은치과 · 출혈과 혈전 위험을 함께 살피는 진료 상담</title>
<desc id="description">짙은 남색 벽과 석류색 벨벳, 크림색 대리석이 어우러진 고전적인 정물화. 중앙에는 양쪽 접시가 수평을 이룬 청동 저울이 있고, 옆에는 약 이름을 적는 빈 수첩과 열리지 않은 유리병, 장미꽃, 복슬복슬한 하얀 고양이가 있다. 혈액희석제를 계속 복용하거나 중단하라는 의료 지시를 나타내지 않는다.</desc>
<defs>
<linearGradient id="wall" x1="0" y1="0" x2="1" y2=".8"><stop stop-color="#2f4051"/><stop offset=".47" stop-color="#506474"/><stop offset="1" stop-color="#a38e80"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#69513d"/><stop offset=".25" stop-color="#f1d9a6"/><stop offset=".49" stop-color="#a78551"/><stop offset=".78" stop-color="#d7ba85"/><stop offset="1" stop-color="#6c553e"/></linearGradient>
<linearGradient id="wood" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#71514e"/><stop offset=".51" stop-color="#b7826c"/><stop offset="1" stop-color="#553f43"/></linearGradient>
<linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#663846"/><stop offset=".5" stop-color="#a65f69"/><stop offset="1" stop-color="#462e3e"/></linearGradient>
<linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffaf0"/><stop offset="1" stop-color="#d7c4a7"/></linearGradient>
<linearGradient id="bottle" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#244d54"/><stop offset=".45" stop-color="#759a9b"/><stop offset=".7" stop-color="#325b65"/><stop offset="1" stop-color="#192f3e"/></linearGradient>
<linearGradient id="cat" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d7dede"/><stop offset=".44" stop-color="#fffefa"/><stop offset="1" stop-color="#d4e3df"/></linearGradient>
<radialGradient id="light"><stop stop-color="#fff6d5" stop-opacity=".8"/><stop offset="1" stop-color="#ffedcc" stop-opacity="0"/></radialGradient>
<filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#1d262d" flood-opacity=".27"/></filter>
<filter id="soft"><feGaussianBlur stdDeviation="22"/></filter>
<pattern id="grain" width="33" height="35" patternUnits="userSpaceOnUse"><path d="M3 7l4 -3M25 19l2 4M15 29l5 -1" fill="none" stroke="#fff7e7" stroke-opacity=".065" stroke-width="1.3"/></pattern>
<path id="leaf" d="M0 0Q16 -18 34 -3Q16 20 0 0Z"/>
</defs>
<rect width="1200" height="720" fill="url(#wall)"/>
<ellipse cx="886" cy="165" rx="370" ry="305" fill="url(#light)"/>
<rect width="1200" height="720" fill="url(#grain)"/>
<!-- dramatic antique frame on the left, creative clinic name and no real medical records -->
