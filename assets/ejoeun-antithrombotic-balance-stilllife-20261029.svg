<!-- gallery footer explicitly avoids medical instructions -->
<text x="680" y="698" font-family="Noto Sans KR,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="12" text-anchor="middle" fill="#fff2dd">창작 정물화 · 출혈 위험과 혈전 위험을 함께 살펴야 함을 상징하며, 약물 중단·유지 여부를 지시하지 않습니다.</text>
