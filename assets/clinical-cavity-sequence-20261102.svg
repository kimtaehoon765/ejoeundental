<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="ttl dsc">
<title id="ttl">충치치료의 세 단계: 확인, 충치 제거, 수복</title>
<desc id="dsc">교합면 충치가 있는 대구치를 확인한 뒤 필요한 부분의 우식을 제거하고 치아색 재료로 수복하는 개념을 단계별로 나타낸 의료 교육용 모식도. 실제 치료 깊이와 수복재료는 진찰 결과에 따라 다릅니다.</desc>
<defs>
<linearGradient id="background" x2=".8" y2="1"><stop stop-color="#fafbfb"/><stop offset="1" stop-color="#eaf1f1"/></linearGradient>
<linearGradient id="enamel" x1=".1" y1="0" x2=".85" y2="1"><stop stop-color="#fffef9"/><stop offset=".52" stop-color="#f7f2e8"/><stop offset="1" stop-color="#d6dfe1"/></linearGradient>
<radialGradient id="depression"><stop stop-color="#e9dbc2"/><stop offset=".75" stop-color="#f4e8d2"/><stop offset="1" stop-color="#f8f6ed"/></radialGradient>
<linearGradient id="dentine" x1="0" x2=".8" y2="1"><stop stop-color="#e5b779"/><stop offset="1" stop-color="#f3ddac"/></linearGradient>
<linearGradient id="instrument" x1="0" x2="1"><stop stop-color="#678890"/><stop offset=".45" stop-color="#f1f6f5"/><stop offset="1" stop-color="#77929c"/></linearGradient>
<filter id="shadow"><feDropShadow dx="0" dy="11" stdDeviation="12" flood-color="#415f62" flood-opacity=".12"/></filter>
