<rect x="449" y="242" width="54" height="32" rx="16" fill="#315e5e"/><text x="476" y="264" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">02</text>
<rect x="824" y="242" width="54" height="32" rx="16" fill="#315e5e"/><text x="851" y="264" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">03</text>
<text x="80" y="316" font-size="24" font-weight="700" fill="#234647">충치 확인</text>
<text x="455" y="316" font-size="24" font-weight="700" fill="#234647">필요한 우식 제거</text>
<text x="830" y="316" font-size="24" font-weight="700" fill="#234647">치아색 재료로 수복</text>
