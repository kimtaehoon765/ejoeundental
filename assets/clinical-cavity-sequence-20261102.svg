</g>
</defs>
<rect width="1200" height="800" fill="url(#background)"/>
<rect x="28" y="28" width="1144" height="744" rx="24" fill="#fff" opacity=".81" stroke="#d6e2e1" stroke-width="2"/>
<text x="56" y="74" font-family="sans-serif" font-size="27" font-weight="700" fill="#264c4d">이조은치과</text>
<text x="1135" y="72" text-anchor="end" font-family="sans-serif" font-size="14" letter-spacing="2.2" fill="#84989a">CLINICAL ATLAS 02</text>
<path d="M56 101H1144" stroke="#d8e3e2"/>
<text x="56" y="152" fill="#213e40" font-family="sans-serif" font-size="31" font-weight="700">충치치료는 어떻게 진행할까요?</text>
<text x="56" y="184" fill="#6d8282" font-family="sans-serif" font-size="18">교합면 충치가 있는 경우의 한 가지 예시입니다.</text>
<g font-family="sans-serif">
<rect x="52" y="218" width="347" height="464" rx="20" fill="#f5f8f7" stroke="#d5e0de" stroke-width="2"/>
