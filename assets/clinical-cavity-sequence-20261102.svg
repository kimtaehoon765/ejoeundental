<text x="77" y="640" fill="#587170" font-size="16">검사로 깊이와 범위를 확인</text>
<text x="452" y="640" fill="#587170" font-size="16">보존 가능한 치질은 최대한 유지</text>
<text x="827" y="640" fill="#587170" font-size="16">재료와 범위는 진찰 후 결정</text>
<text x="58" y="736" font-size="15" fill="#708885">※ 교육용 모식도 · 모든 충치가 같은 과정으로 치료되는 것은 아니며, 초기 충치는 경과관찰이 가능할 수도 있습니다.</text>
</g>
</svg>