<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="artTitle artDescription">
<title id="artTitle">이조은치과 창작 그림 - 턱관절의 작은 쉼표</title>
<desc id="artDescription">햇살이 비추는 청록색과 크림색 공간에서 성인 인물이 손가락으로 턱 주변의 불편한 위치를 가볍게 짚고 있습니다. 탁자 위에는 따뜻한 차와 진료 메모가 놓여 있고 하얀 고양이는 곁에서 쉬고 있습니다. 턱관절 내부 구조나 특정 치료의 효과를 보여 주는 의학 도해가 아닙니다.</desc>
<defs>
 <linearGradient id="wall" x1="0" y1="0" x2="1" y2=".9"><stop stop-color="#f9efdd"/><stop offset=".56" stop-color="#e8f0e4"/><stop offset="1" stop-color="#c7dbd3"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#f8dfbd"/><stop offset=".45" stop-color="#c2dce4"/><stop offset="1" stop-color="#8db29e"/></linearGradient>
 <linearGradient id="suit" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#315b52"/><stop offset="1" stop-color="#6c8774"/></linearGradient>
 <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eab79e"/><stop offset=".5" stop-color="#f3d0ad"/><stop offset="1" stop-color="#c98e7a"/></linearGradient>
 <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#423e40"/><stop offset="1" stop-color="#70625a"/></linearGradient>
 <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b28864"/><stop offset=".55" stop-color="#d8b78c"/><stop offset="1" stop-color="#956e50"/></linearGradient>
 <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e1e9e0"/><stop offset=".53" stop-color="#fffef6"/><stop offset="1" stop-color="#d9e5dd"/></linearGradient>
 <radialGradient id="sunlight"><stop stop-color="#fffdf2" stop-opacity=".8"/><stop offset="1" stop-color="#ffe7ad" stop-opacity="0"/></radialGradient>
 <filter id="soft"><feGaussianBlur stdDeviation="13"/></filter>
 <filter id="depth" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="2" dy="10" stdDeviation="10" flood-color="#264638" flood-opacity=".16"/></filter>
 <pattern id="flecks" width="31" height="39" patternUnits="userSpaceOnUse"><path d="M4 8l3 -4M26 19l4 4M12 30l-2 4" stroke="#947f65" stroke-opacity=".1" stroke-width="1.2"/></pattern>
 <path id="leaf" d="M0 0Q19 -21 42 -2Q17 20 0 0Z"/>
