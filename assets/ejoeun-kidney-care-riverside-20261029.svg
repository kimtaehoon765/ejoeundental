<title id="art-title">이조은치과 · 물가의 진료 준비 서재</title>
<desc id="art-desc">차분한 청록빛 강변과 아치형 창, 투석 일정 확인을 상징하는 달력과 진료 준비 노트, 꽃병, 복슬복슬한 하얀 고양이를 담은 창작 풍경화. 의학적 진단 그림이 아니다.</desc>
