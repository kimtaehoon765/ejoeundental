<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
<title id="title">이조은치과 - 치석 제거와 잇몸 건강, 스케일링 창작 정물화</title>
<desc id="description">하늘빛과 세이지 녹색 수채화 분위기의 서재. 하얀 도자기 치아 조형물과 스케일링 기구를 상징하는 가느다란 금속 도구, 구강검진 기록지, 하얀 털의 고양이, 라벤더와 흰 데이지꽃이 어우러져 있습니다. 실제 환자의 치아 구조나 기구 사용 위치를 설명하는 의료 도해가 아닙니다.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ebf3eb"/><stop offset=".36" stop-color="#f8f5df"/><stop offset=".7" stop-color="#d6e8e5"/><stop offset="1" stop-color="#c5d8c9"/></linearGradient>
<linearGradient id="window" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#add9e2"/><stop offset=".52" stop-color="#d4e8d8"/><stop offset="1" stop-color="#ebd8af"/></linearGradient>
<linearGradient id="skyhill" x1="0" y1="0" x2="1" y2=".65"><stop stop-color="#9dbec0"/><stop offset="1" stop-color="#8eab8e"/></linearGradient>
<linearGradient id="table" x1="0" y1="0" x2="1" y2=".65"><stop stop-color="#caa57b"/><stop offset=".6" stop-color="#e1caa2"/><stop offset="1" stop-color="#a8845b"/></linearGradient>
<linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffefa"/><stop offset="1" stop-color="#eee8d7"/></linearGradient>
<linearGradient id="porcelain" x1="0" y1="0" x2="1" y2=".9"><stop stop-color="#e0d6c0"/><stop offset=".3" stop-color="#fffdf2"/><stop offset=".62" stop-color="#f2ead8"/><stop offset="1" stop-color="#d0bea8"/></linearGradient>
<linearGradient id="steel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#789a9c"/><stop offset=".15" stop-color="#d9eeeb"/><stop offset=".34" stop-color="#748789"/><stop offset=".5" stop-color="#f2f5e8"/><stop offset=".65" stop-color="#8ca7a7"/><stop offset=".85" stop-color="#d8e4df"/><stop offset="1" stop-color="#7f9896"/></linearGradient>
<linearGradient id="cat" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e2e9e3"/><stop offset=".48" stop-color="#fffdf6"/><stop offset="1" stop-color="#dce8e1"/></linearGradient>
<radialGradient id="sun"><stop stop-color="#fff8d9" stop-opacity=".86"/><stop offset="1" stop-color="#fff8d9" stop-opacity="0"/></radialGradient>
<filter id="shadow" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#476050" flood-opacity=".17"/></filter>
<filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
<filter id="wash" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".018" numOctaves="3" seed="7" result="noise"/><feColorMatrix in="noise" type="saturate" values="0" result="mono"/><feComponentTransfer in="mono" result="fade"><feFuncA type="linear" slope=".045"/></feComponentTransfer><feBlend in="SourceGraphic" in2="fade" mode="multiply"/></filter>
<pattern id="grain" width="39" height="41" patternUnits="userSpaceOnUse"><path d="M5 7l3 -3M31 25l5 -2M8 32l4 4" fill="none" stroke="#7e846b" stroke-width="1" opacity=".1"/></pattern>
<path id="leaf" d="M0 0Q18 -18 41 -4Q21 18 0 0Z"/>
<path id="petal" d="M0 0Q-15 -32 0 -38Q17 -24 0 0Z"/>
</defs>
