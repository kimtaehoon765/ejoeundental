<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="artTitle artDesc">
<title id="artTitle">이조은치과 복용약과 전신질환 상담 - 창작 서재 정물화</title>
<desc id="artDesc">햇살이 드는 서재의 짙은 녹색 장식장 위에 펼친 의학 참고서와 청록색 유리 약병, 돋보기, 하얀 꽃이 있는 도자기 꽃병과 복슬복슬한 하얀 고양이가 어우러진 회화풍 창작 정물화. 특정 약물이나 실제 진료 기록을 묘사하지 않는다.</desc>
<defs>
 <linearGradient id="wall" x1="0" y1="0" x2="1" y2=".9"><stop stop-color="#f9f0de"/><stop offset=".46" stop-color="#f0e6d5"/><stop offset="1" stop-color="#c3d6cb"/></linearGradient>
 <linearGradient id="sky" x1="0" y1="0" x2=".6" y2="1"><stop stop-color="#e3f0e9"/><stop offset=".5" stop-color="#b9d6ce"/><stop offset="1" stop-color="#92b5a9"/></linearGradient>
 <linearGradient id="desk" x1="0" y1="0" x2="1" y2=".6"><stop stop-color="#315b4a"/><stop offset=".5" stop-color="#5e816a"/><stop offset="1" stop-color="#274c3f"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2=".95" y2=".7"><stop stop-color="#3d857c" stop-opacity=".8"/><stop offset=".25" stop-color="#b0d6c0" stop-opacity=".6"/><stop offset=".65" stop-color="#327c76" stop-opacity=".86"/><stop offset="1" stop-color="#2d615c" stop-opacity=".8"/></linearGradient>
 <linearGradient id="book" x1="0" y1="0" x2="1" y2=".7"><stop stop-color="#fffefa"/><stop offset=".75" stop-color="#f0e8d7"/><stop offset="1" stop-color="#cfb99b"/></linearGradient>
 <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d9e2db"/><stop offset=".45" stop-color="#fffef8"/><stop offset="1" stop-color="#dbe7dc"/></linearGradient>
 <radialGradient id="sun"><stop stop-color="#fffbe8" stop-opacity=".75"/><stop offset="1" stop-color="#fff6da" stop-opacity="0"/></radialGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="1" dy="12" stdDeviation="12" flood-color="#304b3b" flood-opacity=".20"/></filter>
 <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
 <pattern id="grain" width="43" height="41" patternUnits="userSpaceOnUse"><path d="M6 8l5 -3M32 17l4 5M16 30l-3 4" fill="none" stroke="#887a62" stroke-opacity=".075" stroke-width="1"/></pattern>
 <path id="leaf" d="M0 0Q18 -22 44 -4Q22 19 0 0Z"/>
</defs>
