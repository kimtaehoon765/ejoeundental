<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="ttl dsc">
<title id="ttl">치경부마모증과 시린 이: 잇몸선 주변 마모 위치</title>
<desc id="dsc">치아 목 부분에 쐐기 모양의 결손이 생겨 상아질이 노출될 수 있음을 보여 주는 교육용 모식도. 법랑질, 상아질, 치수, 치은을 구분했습니다. 실제 치아 구조와 증상은 개인마다 다릅니다.</desc>
<defs>
 <linearGradient id="bg" x2=".9" y2="1"><stop stop-color="#f9faf8"/><stop offset="1" stop-color="#edf2f1"/></linearGradient>
 <linearGradient id="en" x1="0" x2=".85" y2="1"><stop stop-color="#fffef8"/><stop offset=".55" stop-color="#f1eee6"/><stop offset="1" stop-color="#d6dfe1"/></linearGradient>
 <linearGradient id="dent" x1="0" x2="1" y2=".5"><stop stop-color="#ffedbf"/><stop offset=".5" stop-color="#e8c58d"/><stop offset="1" stop-color="#dbab67"/></linearGradient>
 <linearGradient id="gum" x1="0" x2="0" y2="1"><stop stop-color="#e9abb0"/><stop offset=".45" stop-color="#d98c93"/><stop offset="1" stop-color="#f0c9ca"/></linearGradient>
 <linearGradient id="plate" x1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f4f7f5"/></linearGradient>
 <pattern id="bone" patternUnits="userSpaceOnUse" width="42" height="39"><rect width="42" height="39" fill="#f4e9d6"/><path d="M7 9l11-5 12 7-2 11-13 7-11-9zM27 31l10-2" fill="none" stroke="#d7bd99" stroke-width="5" opacity=".55"/></pattern>
 <filter id="sh" x="-20%" width="150%" y="-20%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#536a68" flood-opacity=".12"/></filter>
</defs>
<rect width="1200" height="800" fill="url(#bg)"/>
<rect x="28" y="28" width="1144" height="744" rx="24" fill="url(#plate)" stroke="#d8e2df" stroke-width="2"/>
<path d="M57 100H1143" stroke="#dde6e2"/><text x="57" y="73" font-size="28" font-weight="700" fill="#254e49" font-family="sans-serif">이조은치과</text>
<text x="1097" y="73" text-anchor="end" font-size="15" letter-spacing="2" fill="#829793" font-family="sans-serif">CLINICAL ATLAS  01</text>
<text x="65" y="151" font-size="31" font-weight="700" fill="#243e3e" font-family="sans-serif">시린 이와 치경부마모증</text>
<text x="65" y="181" font-size="17" fill="#637b78" font-family="sans-serif">치아와 잇몸 경계 주변의 결손을 살펴봅니다</text>
<rect x="65" y="215" width="580" height="493" rx="24" fill="#f7faf9" stroke="#d4dfdc"/>
<path d="M80 625Q185 540 270 577Q343 616 432 567Q546 515 630 603V691H80Z" fill="url(#bone)" opacity=".74"/>
<path d="M80 548Q180 481 255 510L278 568Q184 553 80 608Z" fill="url(#gum)" stroke="#d5868c" stroke-width="3"/>
<path d="M459 474Q526 476 630 534V597Q526 536 455 548Z" fill="url(#gum)" stroke="#d5868c" stroke-width="3"/>
<g filter="url(#sh)">
<path d="M342 237C310 201 249 201 220 245C179 307 219 390 260 453C281 488 285 539 294 599C299 639 312 681 345 678C374 675 388 636 393 591C402 536 408 490 436 455C478 399 506 306 466 245C436 198 390 208 364 234C354 244 348 244 342 237Z" fill="url(#en)" stroke="#9eaaa6" stroke-width="3.3"/>
<path d="M343 273C315 246 279 261 264 295C240 348 284 411 307 451C319 476 326 553 334 605C337 626 341 637 348 637C355 636 362 623 366 602C381 524 383 478 405 448C438 407 476 340 440 290C426 263 403 252 376 269C358 284 352 281 343 273Z" fill="url(#dent)" stroke="#c99b5c" stroke-width="2"/>
<path d="M345 333C334 326 322 330 321 351C316 385 335 419 342 446C347 477 342 535 344 596C348 607 355 606 357 592C359 534 360 478 366 442C374 405 385 374 375 346C371 331 358 329 345 333Z" fill="#d99396" stroke="#ad6670" stroke-width="2"/>
<path d="M350 374Q346 416 353 462V573" stroke="#b44e5f" stroke-width="3" fill="none"/>
</g>
<!-- The exposed cervical dentin defect is on the right, just above gingival margin. -->
<path d="M449 430Q476 438 465 463L425 476Q440 460 449 430Z" fill="#f8d793" stroke="#ae793e" stroke-width="3.2"/>
<path d="M442 441L461 459L430 469" fill="none" stroke="#d89950" stroke-width="2.4"/>
<circle cx="451" cy="459" r="26" fill="none" stroke="#2d8d9c" stroke-width="3" stroke-dasharray="5 5"/>
<path d="M473 455Q556 414 648 419H702" stroke="#2d8d9c" stroke-width="3" fill="none"/>
<circle cx="704" cy="419" r="6" fill="#2d8d9c"/>
<path d="M497 471l16-13-5 16 19-10M493 491l20-10" fill="none" stroke="#398da3" stroke-width="3" stroke-linecap="round"/>
<rect x="690" y="238" width="432" height="255" rx="20" fill="#fff" stroke="#d7e2df"/>
<text x="719" y="287" font-size="23" fill="#214a4a" font-weight="700" font-family="sans-serif">치경부 마모 부위</text>
<text x="719" y="329" font-size="19" fill="#496463" font-family="sans-serif">치아 목 부분이 패이면</text>
<text x="719" y="363" font-size="19" fill="#496463" font-family="sans-serif">상아질이 노출되어</text>
<text x="719" y="397" font-size="19" fill="#496463" font-family="sans-serif">시림이 나타날 수 있습니다.</text>
<path d="M720 425H1090" stroke="#dce7e3" stroke-width="2"/>
<text x="719" y="461" font-size="15" fill="#64817c" font-family="sans-serif">실제 원인은 진찰과 검사를 통해 구분합니다.</text>
<rect x="690" y="515" width="432" height="175" rx="17" fill="#f1f6f4" stroke="#d7e3df"/>
<g font-family="sans-serif" font-size="17" fill="#355655">
<circle cx="724" cy="555" r="9" fill="#f9f9f2" stroke="#afbbb6"/><text x="746" y="561">법랑질 · 치아의 바깥층</text>
<circle cx="724" cy="595" r="9" fill="#eac587" stroke="#d0a269"/><text x="746" y="601">상아질 · 노출 시 시림 가능</text>
<circle cx="724" cy="635" r="9" fill="#d99396" stroke="#ad6670"/><text x="746" y="641">치수 · 치아 내부의 연조직</text>
<circle cx="724" cy="668" r="9" fill="#dc9097" stroke="#c77c86"/><text x="746" y="674">잇몸 · 치아 주변 조직</text>
</g>
<text x="66" y="744" font-size="15" fill="#718480" font-family="sans-serif">※ 교육용 모식도 · 손상 형태와 치료 필요성은 치아 상태에 따라 달라집니다.</text>
</svg>