<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 385" role="img" aria-labelledby="title desc">
<title id="title">이조은치과 어린이 진료 · 세 장면의 작은 정원</title>
<desc id="desc">유치 검진을 상징하는 빈 진료 노트, 칫솔질을 상징하는 칫솔, 상담을 나타내는 말풍선과 하얀 복슬복슬한 고양이가 세 개의 수채화 정원 창에 나뉘어 등장한다. 실제 진단이나 치료 과정의 그림은 아니다.</desc>
