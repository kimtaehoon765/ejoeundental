<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" role="img" aria-labelledby="tt dd">
<title id="tt">이조은치과 - 골다공증 치료제 복용 이력과 치과진료 상담</title>
<desc id="dd">별이 빛나는 청남색 밤의 고전적인 천문 관측실에 작은 황동 탁상시계, 빈 복용 이력 기록책, 의학 상담용 돋보기, 야생화와 복슬복슬한 하얀 고양이가 있는 독창적 삽화. 실제 약물, 처방 내용, 투여 날짜, 턱뼈 구조나 진료 결과를 보여주지 않는다.</desc>
<defs>
<linearGradient id="night" x1="0" y1="0" x2=".65" y2="1"><stop stop-color="#162b49"/><stop offset=".45" stop-color="#315273"/><stop offset="1" stop-color="#6b817c"/></linearGradient>
<linearGradient id="slate" x1="0" y1="0" x2="1" y2=".8"><stop stop-color="#c4cdd0"/><stop offset=".5" stop-color="#e3dfd3"/><stop offset="1" stop-color="#8599a2"/></linearGradient>
<linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6c5947"/><stop offset=".29" stop-color="#e9d3a6"/><stop offset=".65" stop-color="#ac8a55"/><stop offset="1" stop-color="#7f664d"/></linearGradient>
<linearGradient id="oak" x1="0" y1="0" x2="1" y2=".55"><stop stop-color="#6b4e48"/><stop offset=".55" stop-color="#b5876b"/><stop offset="1" stop-color="#705047"/></linearGradient>
<linearGradient id="parch" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffbee"/><stop offset="1" stop-color="#e5d7bd"/></linearGradient>
<linearGradient id="catcoat" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d4e1e0"/><stop offset=".52" stop-color="#fffefa"/><stop offset="1" stop-color="#dae6dc"/></linearGradient>
<radialGradient id="moonglow"><stop stop-color="#fff6ce" stop-opacity=".8"/><stop offset="1" stop-color="#faebba" stop-opacity="0"/></radialGradient>
<filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="1" dy="10" stdDeviation="12" flood-color="#122233" flood-opacity=".23"/></filter>
