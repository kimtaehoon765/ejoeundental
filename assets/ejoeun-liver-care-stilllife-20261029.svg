<title id="title">이조은치과 · 햇살 드는 온실의 진료 준비</title>
<desc id="desc">황금빛 온실 속 식물과 의료진에게 전할 복용약 목록을 상징하는 노트, 작은 찻잔, 복슬복슬한 하얀 고양이가 있는 아르누보풍 창작 정물화. 간질환의 의학적 도해가 아니다.</desc>
