없으며</strong>, 해당되는 정보만 준비하시면 됩니다.</p><section><h2>준비할 정보</h2><label><input type="checkbox"><span>복용 중인 약과 건강기능식품의 이름 또는 약 봉투를 준비했습니다.</span></label><label><input type="checkbox"><span>항응고제·항혈소판제 및 골다공증 치료제 복용 여부를 확인했습니다.</span></label><label><input type="checkbox"><span>당뇨병·심장질환·고혈압·신장질환 등 전신질환을 의료진에게 알릴 준비가 되었습니다.</span></label><label><input type="checkbox"><span>약물·마취제·라텍스 알레르기 또는 이전 이상반응을 확인했습니다.</span></label><label><input type="checkbox"><span>현재 통증·붓기·출혈 등 증상과 시작 시기를 정리했습니다.</span></label><label><input type="checkbox"><span>과거 치과 치료와 수술 이력을 확인했습니다.</span></label><label><input type="checkbox"><span>임신 여부나 임신 가능성 등 필요한 건강정보를 알릴 준비가 되었습니다.</span></label><label><input type="checkbox"><span>방문 시간과 접수 마감 시간을 확인했습니다.</span></label><label><input type="checkbox"><span>최근 검사 결과나 진료 의뢰서가 있다면 지참할지 확인했습니다.</span></label><label><input type="checkbox"><span>가장 궁금한 점과 치료에 대한 걱정을 메모했습니다.</span></label></section><p class="notice"><strong>중요:</strong> 복용 중인 약은 임의로 중단하지 마세요. 약물 조정은 처방 의료진과 치과의사가 개별적으로 판단해야 합니다. 이 안내는 진단이나 처방을 대신하지 않습니다.</p><p class="print-action"><button type="button" onclick="window.print()" style="padding:10px 18px;border:0;border-radius:9px;background:#086b52;color:white;font:inherit;cursor:pointer">체크리스트 인쇄</button></p><p class="related-links"><a href="/medical-safety-guide.html">약·전신질환 안내</a> · <a href="/visit-guide.html">방문 안내</a> · <a href="/medication-dental-faq.html">복용약 FAQ</a></p><p>진료 문의: <a href="tel:0325132875">032-513-2875</a></p></main><footer><a href="/">이조은치과 홈페이지로 돌아가기</a></footer></body></html>
