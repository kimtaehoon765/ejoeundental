name: Public website build and quality verification
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'content/posts/**'
      - 'content/site.json'
      - 'stories.html'
      - 'search.html'
      - 'noncovered-fees.html'
      - 'clinical-archive.html'
      - 'visit-guide.html'
      - '*-faq.html'
      - 'gum-treatment.html'
      - 'retreatment.html'
      - 'tooth-preservation.html'
      - 'insured-care.html'
      - 'medical-history.html'
      - 'medical-safety-guide.html'
      - 'previsit-checklist.html'
      - 'scripts/**'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'build.mjs'
      - 'scripts/site-audit.mjs'
      - 'package.json'
      - 'scripts/domain-readiness.mjs'
      - 'assets/**'
      - 'health/**'
      - '.github/workflows/public-site-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read-only target domain readiness check
        run: npm run check:domain
      - name: Build public site and run quality audit
        run: npm run build:check
      - name: Check live domain, DNS and indexing entry points (read-only)
        continue-on-error: true
        run: |
          node --check scripts/live-domain-check.mjs
          node scripts/live-domain-check.mjs
      - name: Probe live ChatGPT Naver Google crawler user agents (read-only)
        continue-on-error: true
        run: |
          node --check scripts/check-ai-search-live.mjs
          node scripts/check-ai-search-live.mjs
      - name: Compare live journal caricature and original cat image
        continue-on-error: true
        run: |
          node --check scripts/check-live-journal-art.mjs
          node scripts/check-live-journal-art.mjs
      - name: Confirm public dental art gallery and original paintings
        continue-on-error: true
        run: |
          node --check scripts/check-live-gallery.mjs
          node scripts/check-live-gallery.mjs
      - name: Verify first-visit page is included
        run: |
          test -s dist/previsit-checklist.html
          test -s dist/medical-safety-guide.html
          test -s dist/visit-guide.html
          test -s dist/tooth-preservation.html
          grep -q 'href="/visit-guide.html"' dist/index.html
          grep -q '<loc>https://ejoeundental.com/visit-guide</loc>' dist/sitemap.xml
          grep -q '<loc>https://ejoeundental.com/medical-safety-guide</loc>' dist/sitemap.xml
          grep -q '<loc>https://ejoeundental.com/previsit-checklist</loc>' dist/sitemap.xml
          grep -q 'href="/medical-safety-guide.html"' dist/index.html
          test -s dist/gum-treatment-faq.html
          test -s dist/root-canal-retreatment-faq.html
          test -s dist/dental-insurance-faq.html
          test -s dist/medication-dental-faq.html
          test -s dist/systemic-disease-dental-faq.html
          grep -q '<loc>https://ejoeundental.com/gum-treatment-faq</loc>' dist/sitemap.xml
          grep -q '<loc>https://ejoeundental.com/root-canal-retreatment-faq</loc>' dist/sitemap.xml
          grep -q '<loc>https://ejoeundental.com/dental-insurance-faq</loc>' dist/sitemap.xml
          grep -q '<loc>https://ejoeundental.com/medication-dental-faq</loc>' dist/sitemap.xml
          grep -q '<loc>https://ejoeundental.com/systemic-disease-dental-faq</loc>' dist/sitemap.xml
          grep -q 'href="/medication-dental-faq.html"' dist/medical-history.html
          grep -q 'href="/systemic-disease-dental-faq.html"' dist/visit-guide.html
