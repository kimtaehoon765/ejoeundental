name: Website quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Avoid redundant runs when several commits are pushed in quick succession.
concurrency:
  group: website-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Preview build and SEO audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate build and maintenance script syntax
        run: |
          node --check build.mjs
          for script in scripts/*.mjs; do node --check "$script"; done
          node --check assets/story-directory.js
      - name: Build and validate preview
        run: npm run build:preview:check
      - name: Check domain migration readiness
        run: npm run check:domain

  owner-security:
    name: Owner library and authentication security tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate owner library and authentication
        run: npm run test:owner:all

  production:
    name: Production origin build and SEO audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and validate production origin
        run: npm run build:production:check
      - name: Check every published internal page and resource link
        run: node scripts/check-internal-links.mjs
      - name: Exercise patient site search queries and document indexing
        run: node --test scripts/test-preservation-hub.mjs scripts/test-mobile-booking.mjs scripts/test-story-directory.mjs scripts/test-story-chronology.mjs scripts/test-search-results.mjs scripts/test-search-content.mjs scripts/test-address-copy.mjs scripts/test-contact-card.mjs scripts/test-homepage-static-contact.mjs scripts/test-article-sharing.mjs scripts/test-faq-deep-links.mjs scripts/test-patient-first-layout.mjs scripts/test-archive-topics.mjs scripts/test-doctor-credentials.mjs
