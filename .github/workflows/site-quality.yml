name: Website build quality gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check build.mjs
          node --check assets/search.js
      - name: Build and audit website
        run: npm run build
      - name: Verify output
        run: |
          test -f dist/index.html
          test -f dist/search.html
          test -f dist/sitemap.xml
          test -f dist/content/search-index.json
