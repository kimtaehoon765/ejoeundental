name: Website build quality gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check build.mjs
          node --check assets/search.js
          node --check assets/site.js
      - name: Check for repeated patient stories and original blog links
        run: |
          node --test scripts/test-story-uniqueness.mjs
          node scripts/audit-story-uniqueness.mjs
      - name: Test website search results and keyboard-accessible pagination
        run: node --test scripts/test-search-results.mjs
      - name: Build and audit website
        run: npm run build:check
      - name: Validate mobile Naver booking and fallback labels
        run: node --test scripts/test-mobile-booking.mjs
      - name: Test published patient search index uses clinical text
        run: node --test scripts/test-search-content.mjs
      - name: Verify newest stories appear first on home, topics, care guides and RSS
        run: node --test scripts/test-story-chronology.mjs
      - name: Check natural-tooth preservation hub and its clinical links
        run: node --test scripts/test-preservation-hub.mjs
      - name: Test patient-article directory and lazy full-text search
        run: node --test scripts/test-story-directory.mjs
      - name: Validate patient-friendly breadcrumbs on 46 health articles
        run: node --test scripts/test-health-breadcrumbs.mjs
      - name: Verify output
        run: |
          test -f dist/index.html
          test -f dist/search.html
          test -f dist/sitemap.xml
          test -f dist/content/search-index.json
      - name: Summarize successful website audit
        if: success()
        shell: bash
        run: |
          health_count=$(grep -c '<loc>https://ejoeundental.com/health/' dist/sitemap.xml || true)
          html_count=$(find dist -type f -name '*.html' | wc -l | tr -d ' ')
          {
            echo '## 이조은치과 홈페이지 품질 검사'
            echo ''
            echo '- 빌드 및 자동 검사: 통과'
            echo "- 생성된 HTML 페이지: ${html_count}개"
            echo "- 사이트맵 건강정보 페이지: ${health_count}개"
            echo '- 검사 항목: 기존 빌드 검증 + HTML 제목, 설명, 내부 경로, 사이트맵 대상 확인'
          } >> "$GITHUB_STEP_SUMMARY"
