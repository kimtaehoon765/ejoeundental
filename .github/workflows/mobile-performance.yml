name: Measure live mobile page performance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-performance.yml'
      - 'index.html'
      - 'gallery.html'
      - 'build.mjs'
      - 'assets/ejoeun-gallery-cat-dentist-20261029*.webp'
      - 'assets/ejoeun-original-wisdom-consult-20261029*.webp'
      - 'assets/quiet-window-cat-thumb*.webp'
      - 'assets/cubist-cat-clinic-thumb*.webp'
      - 'assets/home-art-direction-20261030.css'
      - 'assets/atelier-refinement-20261030.css'
      - 'assets/clinic-gallery.css'
      - 'assets/style.css'
      - 'assets/home-enhancements.css'
      - 'assets/address-copy.css'
      - 'assets/gallery-upgrade.css'
      - 'assets/gallery-finish.css'
      - 'assets/museum-home-v2.css'
      - 'assets/atelier-home-2026.css'
      - 'assets/curatorial-home.css'
      - 'assets/gallery-edition-polish.css'
      - 'assets/quiet-museum-finish-20261031.css'
      - 'assets/museum-finish-20261031.css'
      - 'assets/home-visit-faq-salon-20261031.css'
permissions:
  contents: read
jobs:
  lighthouse-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Chrome available on runner
        run: |
          command -v google-chrome
          google-chrome --version
      - name: Record the deployed Cloudflare revision before measuring
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 2 --max-time 30 \
            "https://ejoeundental.com/" -o "$RUNNER_TEMP/live-home.html"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const html=fs.readFileSync(path.join(process.env.RUNNER_TEMP,'live-home.html'),'utf8');
          const deployed=html.match(/<meta name="ejoeundental-build-commit" content="([a-f0-9]{40})"/i)?.[1]||null;
          const source=process.env.GITHUB_SHA;
          const status=deployed===source?'current':deployed?'previous-release':'unknown';
          const report={deployedCommit:deployed,sourceCommit:source,status,checkedOrigin:'https://ejoeundental.com/'};
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'deployment-fingerprint.json'),JSON.stringify(report,null,2));
          console.log('[MOBILE BASELINE] Cloudflare build:',deployed||'not identified','/ workflow source:',source,'/ status:',status);
          if(process.env.GITHUB_STEP_SUMMARY)fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
           '\n**실제 공개 배포 버전:** '+(deployed||'확인 불가')+
           '\n\n**검사 대상 GitHub 커밋:** '+source+
           '\n\n**배포 일치 여부:** '+status+'\n');
          NODE
      - name: Measure actual deployed site in simulated mobile conditions
        shell: bash
        run: |
          set -euo pipefail
          declare -A urls
          urls[home]="https://ejoeundental.com/"
          urls[doctor]="https://ejoeundental.com/doctor"
          urls[gallery]="https://ejoeundental.com/gallery"
          for name in home doctor gallery; do
            echo "Measuring mobile $name on deployed production origin"
            npx --yes lighthouse@12.8.2 "${urls[$name]}" \
              --output=json --output-path="$RUNNER_TEMP/lighthouse-$name.json" \
              --only-categories=performance \
              --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
              --max-wait-for-load=45000 --quiet
          done
      - name: Record lab metrics and diagnostic opportunities
        if: always()
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const labels={home:'홈페이지',doctor:'의료진 소개',gallery:'갤러리'};
          const dir=process.env.RUNNER_TEMP;
          let rows=[];
          for(const [slug,label] of Object.entries(labels)){
            const file=path.join(dir,'lighthouse-'+slug+'.json');
            if(!fs.existsSync(file)){
              rows.push({label,error:'측정 결과 없음'});
              continue;
            }
            const report=JSON.parse(fs.readFileSync(file,'utf8'));
            const audit=key=>report.audits?.[key]?.numericValue;
            const metric=(key,unit)=>{const v=audit(key);return Number.isFinite(v)?(unit==='ms'?Math.round(v)+' ms':v.toFixed(3)):'–';};
            const perf=report.categories?.performance?.score;
            const row={label,url:report.finalDisplayedUrl,score:typeof perf==='number'?Math.round(perf*100):null,
              fcp:metric('first-contentful-paint','ms'),
              lcp:metric('largest-contentful-paint','ms'),
              cls:metric('cumulative-layout-shift','none'),
              tbt:metric('total-blocking-time','ms'),
              speedIndex:metric('speed-index','ms')
            };
            const opportunities=Object.values(report.audits||{})
             .filter(a=>a.details?.type==='opportunity'&&Number.isFinite(a.details?.overallSavingsMs)&&a.details.overallSavingsMs>100)
             .sort((a,b)=>b.details.overallSavingsMs-a.details.overallSavingsMs)
             .slice(0,4)
             .map(a=>({name:a.title,savingsMs:Math.round(a.details.overallSavingsMs)}));
            row.opportunities=opportunities;
            // The performance score alone cannot identify the actual LCP bottleneck.
            // Expose the real rendered LCP node, phase timings and upstream TTFB.
            // Be defensive across Lighthouse releases (not every insight exists).
            const lcpNode=report.audits?.['largest-contentful-paint-element']?.details?.items?.[0]?.node||
             report.audits?.['lcp-breakdown-insight']?.details?.items?.[0]?.node||null;
            row.lcpElement=(lcpNode?.snippet||lcpNode?.nodeLabel||lcpNode?.selector||'not exposed').slice(0,250);
            row.lcpElementUrl=lcpNode?.path||null;
            row.ttfb=metric('server-response-time','ms');
            const lcpInsights=report.audits?.['lcp-breakdown-insight'];
            row.lcpBreakdown=(lcpInsights?.details?.items||[])
             .slice(0,8).map(item=>({
               phase:item.phase||item.label||item.type||'unknown',
               durationMs:Math.round(item.duration||item.timing||item.value||0)
             }));
            const lcpOld=report.audits?.['largest-contentful-paint-element']?.details?.items||[];
            row.lcpLegacyPhases=lcpOld.filter(item=>item && item.phase).slice(0,8)
             .map(item=>({phase:item.phase,durationMs:Math.round(item.timing||0)}));
            const oversizedImages=report.audits?.['uses-responsive-images']?.details?.items||[];
            row.imageOpportunities=oversizedImages
              .filter(i=>Number.isFinite(i.wastedBytes))
              .sort((a,b)=>b.wastedBytes-a.wastedBytes)
              .slice(0,3)
              .map(i=>({url:i.url||'',wastedKB:Math.round(i.wastedBytes/1024)}));
            const unusedCss=report.audits?.['unused-css-rules']?.details?.items||[];
            row.cssOpportunities=unusedCss
              .filter(i=>Number.isFinite(i.wastedBytes))
              .sort((a,b)=>b.wastedBytes-a.wastedBytes)
              .slice(0,4)
              .map(i=>({url:i.url||'',wastedKB:Math.round(i.wastedBytes/1024)}));
            rows.push(row);
          }
          const metricColumn=k=>rows.map(r=>r[k]??'–');
          const lines=[
            '## 모바일 Lighthouse 실측 — 실제 공개 홈페이지',
            '',
            '이 결과는 GitHub Actions Chrome의 **모바일 모의 실험실 측정**입니다. 실제 환자의 모바일 사용 기록(CrUX)이나 네이버·구글 검색 순위가 아닙니다.',
            '',
            '| 페이지 | 점수 | FCP | LCP | CLS | TBT | Speed Index |',
            '|---|---:|---:|---:|---:|---:|---:|',
            ...rows.map(r=>'| '+r.label+' | '+(r.score??'–')+
             ' | '+(r.fcp??'–')+' | '+(r.lcp??'–')+' | '+(r.cls??'–')+
             ' | '+(r.tbt??'–')+' | '+(r.speedIndex??'–')+' |'),
            '',
            '### 관찰된 개선 기회',
            ...rows.flatMap(r=>[
              '- '+r.label+': '+((r.opportunities||[]).map(o=>o.name+' (예상 '+o.savingsMs+' ms)').join(', ')||'자동 추정 항목 없음')
            ]),
            '',
            '### LCP 원인 진단 (실측 당시 공개 버전)',
            ...rows.flatMap(r=>[
              '- '+r.label+' · LCP 요소: '+(r.lcpElement||'확인 불가')+
                ' / 서버 응답: '+(r.ttfb||'–')+
                ' / 시간 구성: '+JSON.stringify(r.lcpBreakdown?.length?r.lcpBreakdown:r.lcpLegacyPhases||[])
            ]),
            '',
            '### 진단된 실제 파일 (실측 당시 공개 버전)',
            ...rows.flatMap(r=>[
              '- '+r.label+' · 불필요한 CSS: '+((r.cssOpportunities||[]).map(x=>x.url.split('/').pop()+' ('+x.wastedKB+' KiB)').join(', ')||'없음'),
              '- '+r.label+' · 과도한 이미지: '+((r.imageOpportunities||[]).map(x=>x.url.split('/').pop()+' ('+x.wastedKB+' KiB)').join(', ')||'없음')
            ]),
            ''
          ];
          const summary=lines.join('\n');
          console.log(summary);
          if(process.env.GITHUB_STEP_SUMMARY)fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,summary+'\n');
          fs.writeFileSync(path.join(dir,'lighthouse-mobile-summary.json'),JSON.stringify(rows,null,2));
          NODE
      - name: Attach original Lighthouse JSON reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-lighthouse-report
          path: |
            ${{ runner.temp }}/lighthouse-home.json
            ${{ runner.temp }}/lighthouse-doctor.json
            ${{ runner.temp }}/lighthouse-gallery.json
            ${{ runner.temp }}/lighthouse-mobile-summary.json
            ${{ runner.temp }}/deployment-fingerprint.json
          if-no-files-found: warn
          retention-days: 7
