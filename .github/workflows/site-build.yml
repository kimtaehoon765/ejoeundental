name: Validate static website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check build.mjs
          node --check assets/site.js
      - name: Build and run SEO audits
        run: npm run build
      - name: Verify mobile Monet painting and patient-first homepage
        run: node --test scripts/test-impressionist-home.mjs
      - name: Verify generated output
        run: |
          test -s dist/index.html
          test -s dist/sitemap.xml
          test -s dist/robots.txt
          test -s dist/search.html
          test -s dist/gum-treatment.html
          test -s dist/retreatment.html
          test -s dist/cervical-abrasion.html
          test -s dist/insured-care.html
          test -s dist/content/site.json
          test -s dist/content/posts-index.json
          test -s dist/content/search-index.json
          test -s dist/content/fees-index.json
          node -e "const fs=require('fs');for(const name of ['site','posts-index','search-index','fees-index'])JSON.parse(fs.readFileSync('dist/content/'+name+'.json','utf8'))"
      - name: Smoke-test runtime content and search paths
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const base='dist';
          const site=JSON.parse(fs.readFileSync(path.join(base,'content/site.json'),'utf8'));
          const entries=JSON.parse(fs.readFileSync(path.join(base,'content/search-index.json'),'utf8'));
          const posts=JSON.parse(fs.readFileSync(path.join(base,'content/posts-index.json'),'utf8'));
          if(!site.clinic||!site.phone||!site.address)throw Error('Clinic runtime details missing');
          if(!Array.isArray(entries)||entries.length===0)throw Error('No searchable pages');
          const homepage=entries.find(item=>item.url==='/');
          if(!homepage)throw Error('Homepage missing from on-site search');
          const homepageText=[homepage.title,homepage.description,homepage.body].join(' ');
          for(const keyword of ['이조은치과','진료시간','주차','잇몸치료','재신경치료']){
            if(!homepageText.includes(keyword))throw Error('Homepage search missing keyword: '+keyword);
          }
          for(const item of entries){
            if(!item||typeof item.url!=='string'||!item.url.startsWith('/')||item.url.startsWith('//'))throw Error('Invalid search result URL');
            const url=new URL(item.url,'https://example.test');
            if(url.origin!=='https://example.test')throw Error('External search result');
            const local=decodeURIComponent(url.pathname).replace(/^\/+/, '');
            const file=path.join(base,local||'index.html');
            const candidate=url.pathname.endsWith('/')&&local?path.join(file,'index.html'):file;
            if(!fs.existsSync(candidate))throw Error('Broken search result: '+item.url);
          }
          if(!Array.isArray(posts))throw Error('Invalid published post index');
          console.log('Runtime smoke test passed:',entries.length,'search entries,',posts.length,'posts');
          NODE
      - name: Publish build verification summary
        if: success()
        run: |
          {
            echo '## 이조은치과 홈페이지 빌드 검증'
            echo ''
            echo '- 상태: **통과**'
            echo '- JavaScript 문법 검사: 통과'
            echo '- 정적 페이지 생성 및 SEO 검사: 통과'
            echo '- 검색 결과 연결 검사: 통과'
            echo ''
            echo '### 생성 결과'
            echo "- HTML 페이지 수: $(find dist -type f -name '*.html' | wc -l)"
            echo "- 사이트맵: $(test -s dist/sitemap.xml && echo '생성됨')"
            echo "- 검색 데이터: $(test -s dist/content/search-index.json && echo '생성됨')"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Explain failed validation
        if: failure()
        run: |
          {
            echo '## 이조은치과 홈페이지 빌드 검증'
            echo ''
            echo '- 상태: **실패 — 확인 필요**'
            echo '- 실패한 단계의 로그를 펼쳐 구체적인 오류를 확인하세요.'
            echo '- 이 결과는 사이트 배포 성공 여부를 의미하지 않습니다.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload generated site for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-build-output
          path: dist/
          if-no-files-found: ignore
          retention-days: 3
