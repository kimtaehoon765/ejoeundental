name: Verify website build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check build script syntax
        run: node --check build.mjs
      - name: Check fee table JavaScript syntax
        run: node --check assets/fees.js
      - name: Check homepage CMS JavaScript syntax
        run: node --check assets/site.js
      - name: Build website
        run: npm run build
      - name: Verify generated site
        run: |
          test -f dist/index.html
          test -f dist/sitemap.xml
          test -f dist/content/posts-index.json
          test -f dist/noncovered-fees.html
          test -f dist/content/fees-index.json
          test -f dist/assets/fees.js
          test -f dist/assets/site.js
          node -e "const fs=require('fs');const html=fs.readFileSync('dist/index.html','utf8');if(!html.includes('id=\"post-list\"')||!html.includes('aria-busy=\"true\"')||!html.includes('<noscript>'))process.exit(1)"
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('dist/content/fees-index.json','utf8'));if(!Array.isArray(x.items))process.exit(1)"
          # Guard against regressions in the optional, user-controlled music UI.
          node <<'NODE'
          const fs = require("node:fs");
          const html = fs.readFileSync("dist/index.html", "utf8");
          const requiredIds = ["music-panel", "music-reopen", "piano-toggle", "piano-volume", "piano-audio", "random-pop", "random-pop-fallback"];
          for (const id of requiredIds) {
            if (!html.includes(`id="${id}"`)) throw new Error(`Missing music control: ${id}`);
          }
          if (!/<div[^>]*id="music-panel"[^>]*hidden/.test(html)) throw new Error("Music panel must start minimized");
          if (!/<audio[^>]*id="piano-audio"[^>]*preload="none"/.test(html)) throw new Error("Audio must not preload");
          if (!html.includes("setPanelVisibility(false)")) throw new Error("Missing minimized default");
          if (!html.includes("aria-controls=")) throw new Error("Missing accessible music controls");
          if (!html.includes("visibilitychange") || !html.includes("pagehide")) throw new Error("Missing audio stop lifecycle handlers");
          console.log("Music controls and safe defaults verified.");
          NODE
          # Ensure local discovery content remains present and links to real clinic information.
          node <<'NODE'
          const fs = require("node:fs");
          const html = fs.readFileSync("dist/index.html", "utf8");
          for (const phrase of ["id=\"neighborhood-guide\"", "청천동", "산곡동", "산곡역", "세월천로 34", "3시간 무료 주차", "/retreatment.html", "/gum-treatment.html"]) {
            if (!html.includes(phrase)) throw new Error("Missing local discovery content: " + phrase);
          }
          for (const href of ["retreatment.html", "gum-treatment.html", "root-canal-health.html"]) {
            if (!fs.existsSync("dist/" + href)) throw new Error("Broken neighborhood guide target: " + href);
          }
          console.log("Local SEO and clinic navigation verified.");
          NODE
          test -d dist/health
          echo "Website build and required files verified."
