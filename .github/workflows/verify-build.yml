name: Verify website build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out website
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source JavaScript
        run: |
          node --check build.mjs
          node --check assets/site.js
          node --check assets/fees.js
          node --check assets/search.js
      - name: Build and audit
        run: npm run build:check
      - name: Verify essential generated files and current patient navigation
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const required = ['index.html','sitemap.xml','robots.txt','search.html','noncovered-fees.html','clinical-archive.html','gum-treatment.html','retreatment.html','cervical-abrasion.html','insured-care.html','content/posts-index.json','content/fees-index.json','content/search-index.json'];
          for (const name of required) {
            if (!fs.existsSync(path.join('dist',name))) throw new Error('Missing generated file: '+name);
          }
          for (const name of ['posts-index','fees-index','search-index']) JSON.parse(fs.readFileSync(path.join('dist','content',name+'.json'),'utf8'));
          const html = fs.readFileSync('dist/index.html','utf8');
          const ids = new Set([...html.matchAll(/\bid=["']([^"']+)["']/g)].map(m=>m[1]));
          for (const id of ['philosophy','focus-care','symptoms','visit-guide','when-to-call','faq','location','local-care']) {
            if (!ids.has(id)) throw new Error('Missing patient section: '+id);
          }
          for (const phrase of ['이조은치과','청천동','산곡동','산곡역','세월천로 34','3시간 무료 주차']) {
            if (!html.includes(phrase)) throw new Error('Missing clinic visit fact: '+phrase);
          }
          for (const target of ['/gum-treatment.html','/retreatment.html','/cervical-abrasion.html','/insured-care.html','/noncovered-fees.html','/search.html']) {
            if (!html.includes('href="'+target+'"')) throw new Error('Missing patient navigation: '+target);
          }
          for (const match of html.matchAll(/href=["']#([^"']+)["']/g)) {
            if (!ids.has(match[1])) throw new Error('Broken homepage anchor: #'+match[1]);
          }
          const fees = fs.readFileSync('dist/noncovered-fees.html','utf8');
          if (!fees.includes('<noscript>')) throw new Error('Missing no-script fee guidance');
          console.log('Current patient navigation and generated content verified.');
          NODE
